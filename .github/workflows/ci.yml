name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-commit-assets:
    name: Build Frontend & Auto-Commit Assets
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend into backend/public
        working-directory: ./frontend
        run: npm run build

      - name: Commit and push compiled assets to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/public
          if ! git diff --cached --quiet; then
            git commit -m "chore(build): auto-compile frontend assets [skip ci]"
            git push origin main
          else
            echo "No changes in backend/public to commit."
          fi

  backend-ci:
    name: Backend CI (Laravel)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, bcmath, filter, openssl, gd
          coverage: none

      - name: Install Composer dependencies
        working-directory: ./backend
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Check PHP Syntax (Linter)
        working-directory: ./backend
        run: |
          find . -name "*.php" ! -path "./vendor/*" -exec php -l {} \;
