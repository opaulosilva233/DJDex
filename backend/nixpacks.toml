[providers]
providers = ["php", "node"]

[variables]
NIXPACKS_PHP_VERSION = '8.4'
NIXPACKS_NODE_VERSION = '22'

[phases.setup]
nixPkgs = ["php84", "php84Extensions.pdo_mysql", "nodejs_22", "git"]

[phases.build]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-interaction",
    "npm ci",
    "npm run build"
]

[phases.preStart]
# Este comando roda logo antes do contentor subir, garantindo que o Laravel limpa caches
# e roda as tabelas no MariaDB usando o driver mysql nativo!
cmds = [
    "php artisan config:clear",
    "php artisan cache:clear",
    "php artisan migrate --force"
]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=$PORT"